services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexusforum
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexuspassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexusforum"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: NexusForum.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Override connection string to target the db container (not localhost).
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=nexusforum;Username=nexus;Password=nexuspassword"
      # Jwt__Key intentionally NOT set here — appsettings.Development.json supplies
      # the weak key. Traversal exploit leaks the same key the API actually uses.
      Jwt__Issuer: "NexusForum"
      Jwt__Audience: "NexusForum"
      Jwt__ExpiryMinutes: "60"
      # Pentester orchestration — api spawns the pentester container via host docker socket.
      PENTESTER_LAUNCH: "docker"
      PENTESTER_NETWORK: "vulnforum_default"
      # Host path (must be absolute on host) for run output persistence.
      # On Windows Docker Desktop, set this to your repo's Pentester/runs path.
      PENTESTER_RUNS_HOST_DIR: "${PENTESTER_RUNS_HOST_DIR:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-opus-4-7}"
      MODEL_BACKEND: "${MODEL_BACKEND:-anthropic}"
      MODEL_MAX_TOKENS: "${MODEL_MAX_TOKENS:-8192}"
      PENTEST_MAX_TURNS: "${PENTEST_MAX_TURNS:-18}"
      LITELLM_MODEL: "${LITELLM_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      SCANNER_URL: "http://zap:8090"
      ZAP_API_KEY: "${ZAP_API_KEY:-changeme}"
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./NexusForum-Client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api

  zap:
    image: zaproxy/zap-stable
    restart: unless-stopped
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.key=${ZAP_API_KEY:-changeme}
      -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    # Not exposed to host; only reachable on the compose network by the pentester.

  pentester:
    build:
      context: ./Pentester
      dockerfile: Dockerfile
    image: vulnforum-pentester           # explicit name — api spawns this image
    profiles: ["pentest"]   # opt-in: docker-compose --profile pentest up pentester
    environment:
      TARGET_URL: "http://api:8080"
      SCANNER_URL: "http://zap:8090"
      SCANNER_BACKEND: "zap"
      ZAP_API_KEY: "${ZAP_API_KEY:-changeme}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      MODEL_BACKEND: "${MODEL_BACKEND:-anthropic}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-opus-4-7}"
    # IMPORTANT: NO volume mounting the repo. Only a write volume for run outputs.
    volumes:
      - ./Pentester/runs:/app/runs
    depends_on:
      - api
      - zap

volumes:
  pgdata:
