server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Route Angular client-side navigation — all unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api calls to the backend container; Angular never hard-codes the API host.
    location /api {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE: pentester stream may go 60+ seconds between events while the LLM thinks.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;
    }
}
